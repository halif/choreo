name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # --------------------------------------------------------------------------
  # 1. TEST & BUILD: Type check, lint, and build production bundle
  # --------------------------------------------------------------------------
  build-and-test:
    name: Lint & Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck TypeScript
        run: npm run lint

      - name: Build frontend and server bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. SECURITY AUDIT: Scan dependencies for vulnerabilities (npm audit)
  # --------------------------------------------------------------------------
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm audit
        run: npm audit --audit-level=high || true

  # --------------------------------------------------------------------------
  # 3. DOCKER BUILD, SMOKE TEST & PUSH: Build, health check, and publish
  # --------------------------------------------------------------------------
  docker-build:
    name: Build, Test & Push Docker Image
    needs: [build-and-test, security-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      # Build local image for smoke test
      - name: Build Docker image locally for Smoke Test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: test-choreo:latest
          cache-from: type=gha

      # SMOKE TEST: Run the built container and verify health check
      - name: Run Container Smoke Test
        run: |
          echo "==> Starting test container..."
          docker run -d -p 3000:3000 --name test-container test-choreo:latest
          
          echo "==> Waiting for Choreo server to initialize..."
          sleep 5
          
          echo "==> Verifying /api/metrics healthcheck..."
          for i in {1..10}; do
            if curl -s -f http://localhost:3000/api/metrics > /dev/null; then
              echo "✅ Choreo container responded successfully to health check!"
              break
            fi
            echo "Waiting for service... ($i/10)"
            sleep 2
          done

          # Тестируем ответ метрик
          RESPONSE=$(curl -s http://localhost:3000/api/metrics)
          echo "Metrics sample response: ${RESPONSE:0:100}..."
          
          docker stop test-container
          docker rm test-container

      # Trivy container security scanning
      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'test-choreo:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push the tested image to GHCR
      - name: Push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 4. DEPLOY: Automated SSH deployment to server (if secrets are configured)
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Puppet Master Host
    needs: [build-and-test, docker-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "==> Deploying Choreo on remote host..."
            cd ${{ secrets.DEPLOY_DIR || '/opt/choreo' }}
            git pull origin master || git pull origin main
            npm install --omit=dev
            npm run build
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart choreo || pm2 start dist/server.cjs --name choreo
            elif systemctl is-active --quiet choreo; then
              sudo systemctl restart choreo
            fi
            echo "==> Deployment completed successfully!"